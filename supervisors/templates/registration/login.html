{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | VikelaMine</title>
  <link rel="stylesheet" href="{% static 'supervisors/css/dashboard.css' %}">
  <style>
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
    .login-panel{width:min(100%,380px);}
    .login-form{display:grid;gap:10px;padding:18px;}
    .login-form label{font-size:12px;font-weight:600;color:var(--ink-soft);}
    .login-form input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--ink);font:inherit;}
    .login-form .errorlist{margin:0;padding:0;list-style:none;color:var(--critical);font-size:12px;}
  </style>
</head>
<body>
  <main class="login-wrap">
    <section class="panel login-panel">
      <header class="panel-head"><h1>VikelaMine sign in</h1></header>
      <form class="login-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.non_field_errors }}
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
        {{ form.username.errors }}
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
        {{ form.password.errors }}
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
