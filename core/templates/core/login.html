{% extends 'core/base.html' %}
{% block content %}
<div class="wrap" style="max-width:520px;padding:48px 24px 72px">
    <section class="card login-card">
        <h1 style="font-size:34px;font-weight:900">
            Log in to VikelaMine
        </h1>
        <p style="color:var(--muted);margin:6px 0 26px">
            Record. Resolve. Prevent.
        </p>

        {% if error %}
            <p role="alert" style="color:var(--red);font-size:14px;margin-bottom:15px">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" placeholder="Enter your username (e.g. Thomas)" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>

            <a href="{% url 'forgot_password' %}" style="display:inline-block;margin-top:16px">Forgot your password?</a>

            <button type="submit" class="btn btn-red" style="width:100%;justify-content:center;margin-top:24px">
                Log In
            </button>
        </form>
    </section>
</div>
{% endblock %}
