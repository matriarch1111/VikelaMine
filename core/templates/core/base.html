<script>

function sendSOS() {

    const confirmed = confirm(
        "EMERGENCY SOS\n\nAre you sure you want to send an emergency alert?"
    );

    if (!confirmed) {
        return;
    }

    if (!navigator.geolocation) {

        alert("GPS is not supported by this browser.");

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;


            fetch("{% url 'sos_alert' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    latitude: latitude,
                    longitude: longitude
                })
            })
            .then(response => response.json())
            .then(data => {

                alert(
                    "SOS SENT!\n\n" +
                    "Latitude: " + latitude.toFixed(5) +
                    "\nLongitude: " + longitude.toFixed(5)
                );

            })
            .catch(error => {

                alert(
                    "SOS location captured, but the server could not be reached."
                );

                console.error(error);

            });

        },

        function(error) {

            alert(
                "Could not get your GPS location.\n\n" +
                "Please allow location access in your browser."
            );

        }

    );

}


/* Get Django CSRF cookie */

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}

</script>
