{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VikelaMine</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{% static 'css/Vikelamine.css' %}">
<style>
:root{--red:#E76F28;--bg:#1A1F26;--panel:#232A34;--panel2:#2A323D;--line:#2E353F}
body{background:var(--bg);font-family:ui-sans-serif,system-ui,sans-serif}
#rockyLauncher{position:fixed;right:20px;bottom:20px;z-index:999;min-width:58px;min-height:58px;border-radius:50%;border:1px solid var(--line);background:var(--red);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#rockyPanel{position:fixed;right:16px;bottom:92px;z-index:998;width:min(370px,calc(100vw - 32px));height:min(520px,calc(100dvh - 112px));display:none;flex-direction:column;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.45);overflow:hidden}
#rockyMessages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px}
.rocky-message{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.rocky-message.assistant{align-self:flex-start;background:var(--panel2)}
.rocky-message.user{align-self:flex-end;background:var(--red)}
</style>
</head>
<body class="text-white">
<header class="sticky top-0 z-50 flex flex-col gap-3 bg-black px-5 py-4 text-white shadow-lg md:flex-row md:flex-wrap md:items-center md:justify-between md:px-8 md:py-5">
    <div class="flex w-full items-center justify-between md:w-auto">
        <a href="{% url 'home' %}" class="text-xl font-bold md:text-2xl">Vike<span class="text-red-600">la</span>Mine</a>
        <button id="menu-toggle" type="button" class="inline-flex min-h-11 items-center gap-2 rounded border border-white/20 px-3 text-sm font-semibold hover:bg-white/10 md:hidden">Menu</button>
    </div>
    <div id="site-navigation" class="hidden w-full border-t border-white/15 pt-3 md:flex md:flex-1 md:flex-wrap md:items-center md:justify-between md:gap-3 md:border-0 md:pt-0">
        <nav class="flex gap-3"><a href="{% url 'home' %}">Home</a><a href="{% url 'reports' %}">Reports</a><a href="{% url 'maps' %}">Maps</a><a href="{% url 'contact' %}">Contact Safety</a></nav>
        <div class="flex gap-3 items-center"><select id="language" class="rounded bg-zinc-800 px-3 py-2"><option value="en">English</option><option value="zu">isiZulu</option><option value="af">Afrikaans</option><option value="tn">Setswana</option><option value="ts">Xitsonga</option><option value="st">Sesotho</option></select><span id="languageStatus" class="text-xs"></span><button onclick="sendSOS(this)" class="rounded-full bg-red-600 px-5 py-2 font-bold">SOS</button></div>
    </div>
</header>
<div class="max-w-[1100px] mx-auto px-6 py-6">{% block content %}{% endblock %}</div>

<button id="rockyLauncher" type="button">🪨</button>
<section id="rockyPanel" role="dialog">
    <header class="flex items-center gap-3 border-b border-zinc-700 bg-[#151A21] p-3"><strong>Rocky</strong><span class="text-xs text-zinc-400">Report assistant</span><button id="rockyClose" type="button" class="ml-auto">✕</button></header>
    <div id="rockyMessages"><p class="rocky-message assistant">Share or select a report first.</p></div>
    <form id="rockyForm" class="flex gap-2 border-t border-zinc-700 p-2"><input id="rockyQuestion" class="flex-1 text-black px-2 rounded" placeholder="Ask about selected report"><button id="rockySend" type="submit" class="rounded bg-[#E76F28] px-3 py-2">Send</button></form>
    <p id="rockyStatus" class="px-3 pb-2 text-xs"></p>
</section>

<footer class="border-t border-zinc-800 p-10 text-center text-xs text-zinc-400 bg-[#151A21] mt-10">© 2026 VikelaMine</footer>

<script>
// --- MENU ---
const menuToggle=document.getElementById("menu-toggle");const siteNav=document.getElementById("site-navigation");
menuToggle?.addEventListener("click",()=>siteNav.classList.toggle("hidden"));

// --- LANGUAGE WHOLE WEB ---
const languageSelect=document.getElementById("language");const languageStatus=document.getElementById("languageStatus");
const savedLang=localStorage.getItem("vikela-language");if(savedLang)languageSelect.value=savedLang;
async function translateText(text, targetLang){try{const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);const data=await res.json();return data.responseData.translatedText||text;}catch{return text;}}
async function translateWholePage(targetLang){if(targetLang==='en'){localStorage.setItem("vikela-language","en");location.reload();return;}languageStatus.textContent="Translating...";document.body.style.opacity="0.6";for(let el of document.querySelectorAll("h1,h2,h3,h4,p,a,button,label,span,li,th,td,strong")){if(el.closest("#rockyPanel")||el.closest("header"))continue;if(el.children.length===0&&el.innerText.trim().length>1&&el.innerText.length<120){const orig=el.getAttribute("data-original")||el.innerText;if(!el.getAttribute("data-original"))el.setAttribute("data-original",orig);el.innerText=await translateText(orig,targetLang);}}document.body.style.opacity="1";languageStatus.textContent="Done";setTimeout(()=>languageStatus.textContent="",1500);}
languageSelect.addEventListener("change",async()=>{localStorage.setItem("vikela-language",languageSelect.value);await translateWholePage(languageSelect.value);});
if(savedLang&&savedLang!=='en')translateWholePage(savedLang);

// --- SOS ---
function getCookie(n){let v=null;document.cookie.split(';').forEach(c=>{c=c.trim();if(c.startsWith(n+'='))v=decodeURIComponent(c.substring(n.length+1))});return v;}
async function sendSOS(b){if(!confirm("SOS?"))return;const o=b.textContent;b.disabled=true;b.textContent="Sending...";const loc=navigator.geolocation?await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>r(null),{timeout:10000})):null;try{const res=await fetch("{% url 'sos_alert' %}",{method:"POST",headers:{"X-CSRFToken":getCookie("csrftoken"),"Content-Type":"application/json"},body:JSON.stringify(loc||{})});alert("Alert sent");}catch{alert("Failed")}finally{b.disabled=false;b.textContent=o;}}

// --- FIX ALL REPORT BUTTONS (THIS WAS MISSING) ---
document.addEventListener("DOMContentLoaded", ()=>{
  document.addEventListener("click", async (e)=>{
    const btn = e.target.closest("button"); if(!btn) return;
    const label = btn.innerText.toLowerCase();
    const card = btn.closest(".report-row") || btn.closest("[data-report-text]")?.parentElement || btn.parentElement?.parentElement || btn.parentElement;

    if(label.includes("translate")){
      const src = card?.querySelector("[data-report-text]")?.getAttribute("data-report-text") || card?.querySelector("[data-report-text]")?.innerText || "Report";
      const target = card?.querySelector("select")?.value || "zu";
      btn.textContent="Translating...";
      const translated = await translateText(src, target);
      let out = card?.querySelector(".report-translation"); if(!out){out=document.createElement("div");out.className="report-translation mt-2 p-2 bg-zinc-800 rounded text-sm";card?.appendChild(out);}
      out.textContent=translated; btn.textContent="Translate";
    }
    if(label.includes("speak")){
      const t = card?.querySelector(".report-translation")?.innerText || card?.querySelector("[data-report-text]")?.innerText || "Report";
      speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
    if(label.includes("convert voice")){
      const audio = card?.querySelector("audio") || document.querySelector("audio");
      if(!audio){alert("No audio");return;}
      btn.textContent="Converting...";
      try{
        const blob = await fetch(audio.src).then(r=>r.blob());
        const fd=new FormData(); fd.append("audio", blob, "voice.webm");
        const res=await fetch("/api/transcribe-voice/", {method:"POST", body:fd, headers:{"X-CSRFToken":getCookie("csrftoken")}});
        const data=await res.json();
        let out=card?.querySelector(".voice-transcript"); if(out) out.textContent=data.transcript||data.error;
        else alert(data.transcript||data.error);
      }catch(err){alert(err.message);}
      btn.textContent="Convert voice to text";
    }
    if(label.includes("ask rocky")){
      const t = card?.querySelector("[data-report-text]")?.innerText || "This report";
      const panel=document.getElementById("rockyPanel"); panel.style.display="flex";
      document.getElementById("rockyQuestion").value="Explain this hazard: "+t;
    }
  });
});
</script>
<script src="{% static 'js/rocky-assistant.js' %}"></script>
</body>
</html>
