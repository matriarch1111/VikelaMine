<!DOCTYPE html>
<html>
<head><title>Forgot Password - VikelaMine</title></head>
<body>

<h2>Forgot Password</h2>

<!-- STEP 1: Enter email or phone -->
<form id="step1">
  <p>Enter your registered email or phone number</p>
  <input type="text" id="contact" placeholder="Email or phone number" required>
  <button type="submit">Send Code</button>
</form>

<!-- STEP 2: Enter PIN -->
<form id="step2" style="display:none;">
  <p>We sent a 6-digit code to <span id="contactDisplay"></span></p>
  <input type="text" id="pin" placeholder="Enter 6-digit PIN" maxlength="6" required>
  <button type="submit">Verify Code</button>
</form>

<!-- STEP 3: Reset password -->
<form id="step3" style="display:none;">
  <p>Create new password</p>
  <input type="password" id="newPassword" placeholder="New password" required>
  <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
  <button type="submit">Save New Password</button>
</form>

<script>
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');

  step1.onsubmit = function(e){
    e.preventDefault();
    document.getElementById('contactDisplay').innerText = document.getElementById('contact').value;
    step1.style.display='none';
    step2.style.display='block';
    // Here you will call your backend to send email/sms
  };

  step2.onsubmit = function(e){
    e.preventDefault();
    step2.style.display='none';
    step3.style.display='block';
    // Here you verify the PIN with backend
  };

  step3.onsubmit = function(e){
    e.preventDefault();
    let p1 = document.getElementById('newPassword').value;
    let p2 = document.getElementById('confirmPassword').value;
    if(p1 !== p2){ alert('Passwords do not match'); return; }
    alert('Password saved successfully');
    window.location.href = 'login.html';
    // Here you save new password to backend
  };
</script>

</body>
</html>
