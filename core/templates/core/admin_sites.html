{% extends 'core/base.html' %}
{% block content %}
<div class="appbar"><a href__="{% url 'dashboard' %}" class="link">← Admin</a><b>Mining Site Management</b><span></span></div>
<div class="wrap" style="padding:30px 24px">
  <div class="grid grid-2">
    <div class="card"><h3 style="margin-top:0">Add site</h3>
      <form method="post">{% csrf_token %}
        <label>Name</label><input name="name" required>
        <label>Latitude</label><input name="latitude" required type="number" step="any">
        <label>Longitude</label><input name="longitude" required type="number" step="any">
        <label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select>
        <div style="height:14px"></div><button class="btn btn-red" style="width:100%;justify-content:center">Add</button>
      </form></div>
    <div class="card" style="padding:0;overflow:hidden"><table><tr><th>Site</th><th>GPS</th><th>Status</th></tr>
      {% for s in sites %}<tr><td>{{ s.name }}</td><td>{{ s.latitude|floatformat:3 }}, {{ s.longitude|floatformat:3 }}</td><td>{{ s.status }}</td></tr>{% endfor %}</table></div>
  </div>
</div>
{% endblock %}
